name: Railway Reservation System CI/CD

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: RRS-ubuntu-x64.zip
          - os: windows-latest
            package: RRS-windows-x64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev zip
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build application and test suites
        run: cmake --build build --config Release --parallel
      - name: Run all CTest suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/RRS/data
          cp build/railway dist/RRS/railway
          cp data/trains.dat dist/RRS/data/trains.dat
          cp README.md dist/RRS/README.md
          chmod +x dist/RRS/railway
          zip -r "${{ matrix.package }}" dist/RRS
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter railway.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "railway.exe was not produced by the build." }
          New-Item -ItemType Directory -Force -Path "dist/RRS/data" | Out-Null
          Copy-Item $exe.FullName "dist/RRS/railway.exe"
          Copy-Item "data/trains.dat" "dist/RRS/data/trains.dat"
          Copy-Item "README.md" "dist/RRS/README.md"
          Compress-Archive -Path "dist/RRS/*" -DestinationPath "${{ matrix.package }}" -Force
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: rrs-${{ matrix.os }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install quality tools and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev cppcheck
          python3 -m pip install --user gcovr
      - name: Run Cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem -I src src
      - name: Configure coverage build
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DRRS_ENABLE_COVERAGE=ON
      - name: Build instrumented application and tests
        run: cmake --build build-coverage --parallel
      - name: Run tests for coverage
        run: ctest --test-dir build-coverage --output-on-failure
      - name: Generate coverage summary and report
        run: |
          mkdir -p coverage
          $HOME/.local/bin/gcovr --root . --filter "src/" --exclude-unreachable-branches --print-summary --xml-pretty --output coverage/coverage.xml
          $HOME/.local/bin/gcovr --root . --filter "src/" --exclude-unreachable-branches --html-details --output coverage/index.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rrs-coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned application release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: rrs-*
          path: release-artifacts
          merge-multiple: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/rrs-ubuntu-latest/RRS-ubuntu-x64.zip release-artifacts/rrs-windows-latest/RRS-windows-x64.zip --title "${GITHUB_REF_NAME}" --generate-notes
