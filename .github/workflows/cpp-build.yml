name: Railway Reservation System CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: RRS-ubuntu-x64.zip
          - os: windows-latest
            package: RRS-windows-x64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev zip
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build application and test suites
        run: cmake --build build --config Release --parallel
      - name: Run all CTest suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/RRS/data dist/RRS/lib
          cp build/railway dist/RRS/railway
          cp data/trains.dat dist/RRS/data/trains.dat
          cp README.md dist/RRS/README.md
          # Bundle non-base-system shared libraries (including OpenSSL libcrypto).
          while IFS= read -r lib; do
            case "$lib" in
              */libc.so*|*/libm.so*|*/libpthread.so*|*/libdl.so*|*/librt.so*|*/ld-linux*.so*|*/libgcc_s.so*|*/libstdc++.so*) continue ;;
            esac
            cp -L "$lib" dist/RRS/lib/
          done < <(ldd build/railway | awk '$2 == "=>" {print $3} $1 ~ /^\// {print $1}')
          cat > dist/RRS/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          APP_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$APP_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd "$APP_DIR"
          exec "$APP_DIR/railway" "$@"
          EOF
          chmod +x dist/RRS/railway dist/RRS/run.sh
          (cd dist && zip -r "$GITHUB_WORKSPACE/${{ matrix.package }}" RRS)
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter railway.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "railway.exe was not produced by the build." }
          New-Item -ItemType Directory -Force -Path "dist/RRS/data" | Out-Null
          Copy-Item $exe.FullName "dist/RRS/railway.exe"
          Copy-Item "data/trains.dat" "dist/RRS/data/trains.dat"
          Copy-Item "README.md" "dist/RRS/README.md"
          # The executable dynamically links OpenSSL 3; ship its runtime DLL beside the EXE.
          $searchDirs = @()
          if ($env:OPENSSL_ROOT_DIR) { $searchDirs += (Join-Path $env:OPENSSL_ROOT_DIR "bin") }
          if ($env:VCPKG_ROOT) { $searchDirs += (Join-Path $env:VCPKG_ROOT "installed/x64-windows/bin") }
          $searchDirs += @("C:\Program Files\OpenSSL-Win64\bin", "C:\Program Files\OpenSSL\bin")
          $searchDirs += ($env:PATH -split ';')
          $searchDirs = $searchDirs | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $cryptoDll = Get-ChildItem -Path $searchDirs -Filter "libcrypto-3-x64.dll" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cryptoDll) { throw "OpenSSL runtime DLL libcrypto-3-x64.dll was not found; refusing to publish an incomplete package." }
          Copy-Item $cryptoDll.FullName "dist/RRS/libcrypto-3-x64.dll"
          Compress-Archive -Path "dist/RRS" -DestinationPath "${{ matrix.package }}" -Force
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: rrs-${{ matrix.os }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install quality tools and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev cppcheck
          python3 -m pip install --user gcovr
      - name: Run Cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem -I src src
      - name: Configure coverage build
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DRRS_ENABLE_COVERAGE=ON
      - name: Build instrumented application and tests
        run: cmake --build build-coverage --parallel
      - name: Run tests for coverage
        shell: bash
        run: |
          mkdir -p docs/reports coverage
          {
            echo "# Unit Test Execution Report"
            echo
            echo "Generated by GitHub Actions from the coverage-instrumented CMake build."
            echo
            echo '```text'
            ctest --test-dir build-coverage --output-on-failure
            test_status=$?
            echo '```'
            exit "$test_status"
          } 2>&1 | tee docs/reports/UNIT_TEST_REPORT.md
      - name: Generate coverage and validation reports
        shell: bash
        run: |
          cp build-coverage/test-work/PerformanceTests/performance-results.txt docs/reports/performance-results.txt
          {
            echo "# Performance Validation Results"
            echo
            cat docs/reports/performance-results.txt
          } > docs/reports/PERFORMANCE_REPORT.md
          $HOME/.local/bin/gcovr --root . --filter "src/" --exclude-unreachable-branches --print-summary | tee coverage/summary.txt
          cp coverage/summary.txt docs/reports/coverage-summary.txt
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          $HOME/.local/bin/gcovr --root . --filter "src/" --exclude-unreachable-branches --xml-pretty --output docs/reports/coverage.xml
          $HOME/.local/bin/gcovr --root . --filter "src/" --exclude-unreachable-branches --html-details --output docs/reports/coverage.html
          {
            echo "# Code Coverage Report"
            echo
            echo "Coverage is measured from the CTest run in this workflow. See coverage-summary.txt and coverage.html for details."
            echo
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } > docs/reports/CODE_COVERAGE_REPORT.md
          {
            echo "# Branch Coverage Report"
            echo
            echo "The required target is at least 70% branch coverage. The measured value below is the actual result of this workflow; the target is not treated as achieved unless the report confirms it."
            echo
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } > docs/reports/BRANCH_COVERAGE_REPORT.md
          {
            echo "# System Validation Report"
            echo
            echo "Automated CI validates compilation, registered CTest suites, Cppcheck, coverage, and the measured NFR-01/NFR-02/NFR-04 checks. NFR-03 startup timing, NFR-05 peak memory, manual end-to-end acceptance walkthroughs for UC-01 to UC-13, and security checks not represented by automated tests remain open. This report does not claim those activities passed."
            echo
            echo "## Automated performance measurements"
            cat docs/reports/performance-results.txt
          } > docs/reports/SYSTEM_VALIDATION_REPORT.md
      - name: Upload testing and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: rrs-testing-reports
          path: docs/reports/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned application release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: rrs-*
          path: release-artifacts
          merge-multiple: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/rrs-ubuntu-latest/RRS-ubuntu-x64.zip release-artifacts/rrs-windows-latest/RRS-windows-x64.zip --title "${GITHUB_REF_NAME}" --generate-notes
